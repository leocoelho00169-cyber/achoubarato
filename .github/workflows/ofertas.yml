name: Robô de ofertas

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3): 08:00, 12:30, 18:00 e 21:00 no Brasil
    - cron: '0 11 * * *'
    - cron: '30 15 * * *'
    - cron: '0 21 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:        # botão "Run workflow" na aba Actions
    inputs:
      dry_run:
        description: 'Simular sem publicar? (1 = sim)'
        default: '0'

concurrency:
  group: robo-ofertas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Executar robô
        run: node bot/run.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          SHEIN_LINK_TEMPLATE: ${{ secrets.SHEIN_LINK_TEMPLATE }}
